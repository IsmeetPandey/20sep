[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-surface"
version = "0.1.0"
description = "Static risk and quality linting for Model Context Protocol tool manifests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ismeet Pandey"}]
dependencies = []

[project.scripts]
mcp-surface = "mcpsurface.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
